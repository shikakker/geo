name: EarthLens Library Catalog Audit
on:
  pull_request:
    paths:
      - 'earthlens-3d/geo-library-catalog.js'
      - 'earthlens-3d/scripts/verify-geolibrary-catalog.mjs'
      - '.github/workflows/earthlens-geolibrary-audit.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    defaults:
      run:
        working-directory: earthlens-3d
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '24'
      - name: Verify 100 real published npm packages and licenses
        run: node scripts/verify-geolibrary-catalog.mjs
