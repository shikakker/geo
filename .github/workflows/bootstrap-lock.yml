name: Bootstrap geo lock

on:
  push:
    branches: [portfolio-improvements-2026-08]
    paths:
      - .github/workflows/bootstrap-lock.yml

permissions:
  contents: write

jobs:
  bootstrap:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          ref: portfolio-improvements-2026-08
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: Resolve exact UI dependency and lockfile
        run: npm install --save-exact @vercel/examples-ui@latest
      - run: npm audit --omit=dev --audit-level=high
      - run: npm test
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run build
      - name: Commit verified dependency state
        run: |
          git config user.name 'Egor Denisov'
          git config user.email 'designer.egor@ya.ru'
          git add package.json package-lock.json
          git commit -m 'build: pin verified geo dependencies'
          git push origin HEAD:portfolio-improvements-2026-08
