name: Bootstrap geo lock

# One-shot verified dependency lock bootstrap after the Tailwind/Next 16 build repair.
on:
  workflow_dispatch:
  push:
    branches: [portfolio-improvements-2026-08]
    paths:
      - .github/workflows/bootstrap-lock.yml

permissions:
  contents: write

jobs:
  bootstrap:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          ref: portfolio-improvements-2026-08
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: Resolve stable dependency lockfile
        run: npm install
      - name: Production dependency audit
        run: npm audit --omit=dev --audit-level=high
      - run: npm test
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run build
      - name: Commit verified dependency state
        run: |
          git config user.name 'Egor Denisov'
          git config user.email 'designer.egor@ya.ru'
          git add package-lock.json
          if git diff --cached --quiet; then
            echo 'No lockfile changes to commit'
            exit 0
          fi
          git commit -m 'build: pin verified geo dependencies'
          git fetch origin portfolio-improvements-2026-08
          git rebase origin/portfolio-improvements-2026-08
          git push origin HEAD:portfolio-improvements-2026-08
