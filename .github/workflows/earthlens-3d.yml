name: EarthLens 3D - Build and Smoke Tests
on:
  push:
    branches: [main]
    paths:
      - 'earthlens-3d/**'
      - '.github/workflows/earthlens-3d.yml'
  pull_request:
    paths:
      - 'earthlens-3d/**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: earthlens-3d
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Node.js 24
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '24'
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Syntax and invariant tests
        run: npm run check
      - name: Production bundle
        run: npm run build
        env:
          VITE_CESIUM_ION_PUBLIC_TOKEN: ${{ vars.CESIUM_ION_PUBLIC_TOKEN }}
      - name: Verify generated map assets
        run: |
          test -f dist/index.html
          test -f dist/scenes.json
          test -f dist/open-source-stack.json
          test -n "$(find dist/assets -type f -name '*.js' -print -quit)"
      - name: Install headless Chromium for browser smoke tests
        run: |
          npm install --no-save playwright@1.56.1 --no-audit --no-fund
          npx playwright install --with-deps chromium
      - name: Start local preview
        run: |
          npm run preview -- --port 4173 > /tmp/earthlens-preview.log 2>&1 &
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:4173/ > /dev/null; then exit 0; fi
            sleep 1
          done
          cat /tmp/earthlens-preview.log
          exit 1
      - name: Check real desktop and mobile map rendering
        run: node tests/browser-smoke.mjs
      - name: Verify real WebGL satellite textured rooftops
        run: node tests/satellite-roofs-browser.mjs
      - name: Probe Tokyo PLATEAU 3D Tiles and log provider errors
        # Upstream trial assets may time out: do not block a valid 3D OSM fallback release.
        continue-on-error: true
        run: node tests/scene-smoke.mjs
      - name: Probe optional Cesium ion Redmond LOD if authorized token configured
        if: ${{ vars.CESIUM_ION_PUBLIC_TOKEN != '' }}
        run: node tests/scene-smoke.mjs
        env:
          EARTHLENS_SCENE_ID: redmond-campus-khr
      - name: Probe Utrecht KHR Gaussian 3D Tiles and log provider responses
        # Upstream trial assets may time out: do not block a valid 3D OSM fallback release.
        continue-on-error: true
        run: node tests/scene-smoke.mjs
        env:
          EARTHLENS_SCENE_ID: wilhelmina-khr
      - name: Upload map screenshots
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: earthlens-browser-smoke
          path: earthlens-3d/screenshots
          if-no-files-found: ignore
      - name: Save static build
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: earthlens-3d-dist
          path: earthlens-3d/dist
          if-no-files-found: error
