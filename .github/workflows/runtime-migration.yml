name: Runtime migration

on:
  push:
    branches: [ai/product-completion/geo]
    paths:
      - .github/workflows/runtime-migration.yml

permissions:
  contents: write

jobs:
  migrate:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ai/product-completion/geo
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm install
      - name: Pin supported runtime and tooling
        run: |
          npm install --save-exact next@15.5.24 react@18.2.0 react-dom@18.2.0
          npm install --save-dev --save-exact eslint@8.57.1 eslint-config-next@15.5.24 typescript@5.9.2 @types/node@22.18.6 @types/react@18.3.24 @types/react-dom@18.3.7
          node <<'NODE'
          const fs = require('fs')
          const pkg = JSON.parse(fs.readFileSync('package.json', 'utf8'))
          pkg.engines = { node: '22.x' }
          pkg.packageManager = 'npm@10.9.8'
          pkg.scripts = { ...pkg.scripts, lint: 'eslint . --max-warnings=0', typecheck: 'tsc --noEmit' }
          fs.writeFileSync('package.json', JSON.stringify(pkg, null, 2) + '\n')
          NODE
          npm install --package-lock-only
          npm ci
      - run: node --test tests/*.test.mjs
      - run: npm audit --omit=dev --audit-level=high
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run build
      - name: Commit verified dependency state
        run: |
          git config user.name 'Egor Denisov'
          git config user.email 'designer.egor@ya.ru'
          git add package.json package-lock.json
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m 'fix: pin Geo example to supported runtime'
          git push origin HEAD:ai/product-completion/geo
