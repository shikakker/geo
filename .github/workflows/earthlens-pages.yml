name: EarthLens 3D - Free GitHub Pages Fallback

on:
  push:
    branches: [main]
    paths:
      - 'earthlens-3d/**'
      - '.github/workflows/earthlens-pages.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: earthlens-pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: earthlens-3d
    steps:
      - name: Checkout public repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Configure Node 24
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '24'
      - name: Install project
        run: npm install --no-audit --no-fund
      - name: Build for the public /geo/ base path
        run: npm run build
        env:
          EARTHLENS_BASE: /geo/
      - name: Validate published files
        run: |
          test -f dist/index.html
          test -n "$(find dist/assets -name '*.js' -print -quit)"
          grep -q /geo/assets/ dist/index.html
      - name: Upload GitHub Pages website
        uses: actions/upload-pages-artifact@7b1f4a764d45c48632c6b24a0339c27f5614fb0b # v4
        with:
          path: earthlens-3d/dist

  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: build
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    permissions:
      pages: write
      id-token: write
    steps:
      - name: Configure GitHub Pages
        uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5
        with:
          enablement: true
      - name: Publish site
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
